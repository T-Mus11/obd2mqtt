name: PlatformIO compile
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/native/**'
      - 'platformio.ini'
      - '.github/workflows/platformio-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-presence-state:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and run portable BLE state-machine tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc test/native/ble_presence_state_test.cpp -o /tmp/ble_presence_state_test
          /tmp/ble_presence_state_test
      - name: Validate expiring MQTT on-demand request IDs and timestamps
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc test/native/poll_command_guard_test.cpp -o /tmp/poll_command_guard_test
          /tmp/poll_command_guard_test
      - name: Validate adapter registry IDs, MACs and ELM protocol codes
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc test/native/obd_adapter_registry_test.cpp -o /tmp/obd_adapter_registry_test
          /tmp/obd_adapter_registry_test
      - name: Check embedded Web UI JavaScript syntax and adapter form anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/web_ui.h').read_text()
          assert source.count('<script>') == 1 and source.count('</script>') == 1
          script = source.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/obd2mqtt-web-ui.js').write_text(script)
          for marker in ['data-t="adapters"', 'id="obdrows"', 'id="obdsave"', 'function obdValidate', "obd_adapters:rows", "obdEqual(rows,c.obd_adapters)"]:
              assert marker in source, marker
          PY
          node --check /tmp/obd2mqtt-web-ui.js
          node test/native/obd_adapter_ui_test.js
      - name: Enforce no-ATRV opt-in and native HA button contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path("src/config.cpp").read_text()
          poller = Path("src/poller.cpp").read_text()
          mqtt = Path("src/mqtt_ha.cpp").read_text()
          assert 'o["voltage_mode"] = adapter.voltageMode;' in config
          assert 'a.voltageMode != "guard" && a.voltageMode != "ignore"' in config
          assert 'const bool ignoreVoltage' in poller
          assert 'ignoreVoltage ? NAN : readVoltage()' in poller
          assert 'target.voltageMode != "ignore"' in poller
          assert 'publishAdapterPollResult(adapterId, payload' in poller
          assert 'publishConfig("button", "obd_" + a.id + "_poll"' in mqtt
          assert 'publishConfig("sensor", "obd_" + a.id + "_poll_status"' in mqtt
          assert 'buttonSessionNonce = String((unsigned long)nonce, HEX)' in mqtt
          assert 'esp_random()' in mqtt
          assert 'memcmp(payload, "PRESS", 5)' in mqtt
          assert 'pendingButtonOutcome' in mqtt
          assert 'mqtt.publish(result.c_str(), payload.c_str(), true);' in mqtt
          print("PASS: No-ATRV opt-in, native MQTT Discovery button/status, nonce and deferred callback")
          PY
      - name: Verify non-destructive boot and stable HA Discovery identity
        run: |
          ! grep -R 'LittleFS.begin(true)' src
          grep -Fq 'LittleFS.begin(false)' src/config.cpp
          grep -Fq 'Poller::begin(fsOk && cfgOk && !Watchdog::safeMode())' src/main.cpp
          grep -Fq 'if (fsOk && cfgOk) migrateProfiles()' src/main.cpp
          grep -Fq 'd["unique_id"] = deviceId() + "_" + objId;' src/mqtt_ha.cpp
  rollback-v0324:
    # Rebuild of the known repository baseline, NOT a byte-for-byte dump of the
    # already-installed device. Keep this artifact locally before any OTA test.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v0.3.24 source baseline
        uses: actions/checkout@v4
        with:
          ref: f830e845c3bb8db1926860fb2d2448cf3e316a82
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio>=6,<7'
      - name: Exclude orphaned online updater (not referenced in v0.3.24)
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("platformio.ini")
          source = path.read_text()
          anchor = "board_build.partitions = min_spiffs.csv"
          assert anchor in source and "build_src_filter" not in source
          source = source.replace(anchor, "build_src_filter = +<*> -<online_update.cpp>\n" + anchor)
          path.write_text(source)
          PY
      - name: Compile baseline esp32dev OTA image, no upload
        run: pio run -e esp32dev
      - name: Generate provenance and checksum
        run: |
          test -s firmware/obd2mqtt-v0.3.24-esp32dev-ota.bin
          sha256sum firmware/obd2mqtt-v0.3.24-esp32dev-ota.bin > firmware/SHA256SUMS-v0.3.24.txt
          printf '%s\n' 'Source: T-Mus11/obd2mqtt@f830e845c3bb8db1926860fb2d2448cf3e316a82' 'Board: esp32dev / ESP32-WROOM-32D' 'Build: online_update.cpp excluded because its obsolete references break compilation' 'Important: source rebuild, NOT verified identical to installed firmware v0.3.24' 'Use: rollback only after explicit user approval, with validated JSON config backup' > firmware/ROLLBACK-SOURCE-v0.3.24.txt
      - name: Archive baseline rollback files for manual download
        uses: actions/upload-artifact@v4
        with:
          name: rollback-source-rebuild-v0.3.24-esp32dev
          path: |
            firmware/obd2mqtt-v0.3.24-esp32dev-ota.bin
            firmware/SHA256SUMS-v0.3.24.txt
            firmware/ROLLBACK-SOURCE-v0.3.24.txt
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32s3, esp32c3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio>=6,<7'
      - name: Build firmware (no upload)
        run: pio run -e ${{ matrix.environment }}
      - name: SHA256 and source manifest (M2d draft test image)
        if: matrix.environment == 'esp32dev'
        run: |
          test -s firmware/obd2mqtt-v0.3.24-m2d-test-esp32dev-ota.bin
          sha256sum firmware/obd2mqtt-v0.3.24-m2d-test-esp32dev-ota.bin > firmware/SHA256SUMS-m2d.txt
          printf '%s\n' "Source: T-Mus11/obd2mqtt@${{ github.event.pull_request.head.sha || github.sha }}" "Board: esp32dev / ESP32-WROOM-32D" "Firmware version: 0.3.24-m2d-test" "OTA application only; not a factory or full flash image" "Manual test: no automatic upload, no merge" > firmware/M2D-SOURCE.txt
      - name: Archive ESP32-WROOM OTA image (manual test only)
        if: matrix.environment == 'esp32dev'
        uses: actions/upload-artifact@v4
        with:
          name: obd2mqtt-m2d-esp32dev-ota-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            firmware/obd2mqtt-v0.3.24-m2d-test-esp32dev-ota.bin
            firmware/SHA256SUMS-m2d.txt
            firmware/M2D-SOURCE.txt
          if-no-files-found: error
          retention-days: 30

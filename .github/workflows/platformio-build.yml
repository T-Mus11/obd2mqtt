name: PlatformIO compile
on:
  pull_request:
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/platformio-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32s3, esp32c3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio>=6,<7'
      - name: Build firmware (no upload)
        run: pio run -e ${{ matrix.environment }}
